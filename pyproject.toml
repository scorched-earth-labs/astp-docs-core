[project]
name = "ariadne-docs"
version = "0.2.0"
description = "Retrieval core library for Project Ariadne's documentation servers — structure-aware chunker, exact-lookup index, pluggable vector search, and shared tool logic. Consumed by the open and enterprise MCP/web servers."
readme = "README.md"
requires-python = ">=3.10"
# Exact-lookup + the chunker/index are pure-stdlib. Vector search needs numpy.
dependencies = []

[project.optional-dependencies]
# Vector search: the default offline TF-IDF embedder + in-memory store.
embeddings = ["numpy>=1.24"]
# Optional neural embedding for deployments that opt in.
openai = ["openai>=1.0"]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne_docs"]
