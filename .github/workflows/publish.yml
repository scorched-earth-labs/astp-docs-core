name: publish

# Publishes astp-docs to PyPI through Trusted Publishing: no stored token. PyPI
# trusts this workflow file in this repository, in the `pypi` environment, and
# nothing else.
#
# Started by hand from main. The upload waits for the `pypi` environment's
# required reviewers.
#
# astp-docs is the dependency of astp-docs-server, so it publishes first.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[embeddings,dev]" build twine
      - name: Full suite
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Check
        run: |
          twine check dist/*
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -c "import zipfile,sys; n=zipfile.ZipFile(sys.argv[1]).namelist(); sys.exit(not all(any(x.endswith('dist-info/licenses/'+f) for x in n) for f in ('LICENSE.txt','NOTICE')))" dist/astp_docs-"$version"-py3-none-any.whl \
            || { echo "::error::the wheel does not carry LICENSE.txt and NOTICE"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/astp-docs/$version/json")
          test "$status" = 404 \
            || { echo "::error::astp-docs $version is already on PyPI (HTTP $status); bump the package version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astp-docs/
    permissions:
      id-token: write  # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
